[project]
name = "zenshield"
version = "2.0.0"
description = "Production-ready Message Phishing Verification, Tanglish Analysis, and Privacy Masking Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call `Depends` in argument defaults (standard FastAPI pattern)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
