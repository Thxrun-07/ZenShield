version: "3.8"

services:
  zenshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenshield:2.0.0
    container_name: zenshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ZENSHIELD_HOST=0.0.0.0
      - ZENSHIELD_PORT=8000
      - ZENSHIELD_DEBUG=false
      - ZENSHIELD_ENVIRONMENT=production
      - ZENSHIELD_DATABASE_URL=sqlite:////app/data/zenshield.db
      - ZENSHIELD_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - ZENSHIELD_MAX_REQUEST_BODY_BYTES=65536
      - ZENSHIELD_MAX_UPLOAD_SIZE_BYTES=10485760
    volumes:
      - zenshield-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zenshield-data:
    driver: local
